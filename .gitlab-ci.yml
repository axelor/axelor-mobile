stages: [check, build, test, release]

variables:
  NODE_IMAGE: node:22.14.0
  ANDROID_IMAGE: reactnativecommunity/react-native-android:v21.1
  RELEASE_IMAGE: registry.gitlab.com/gitlab-org/release-cli:latest
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn-cache"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH =~ /^(main|dev|wip)$/
    - if: $CI_COMMIT_BRANCH =~ /^\d+\.\d+$/

default:
  interruptible: true
  cache:
    key:
      files: [yarn.lock]
    paths: [.yarn-cache]

.on-tag:
  rules:
    - if: $CI_COMMIT_TAG

format:
  stage: check
  image: $NODE_IMAGE
  needs: []
  script:
    - yarn install --frozen-lockfile
    - yarn format:check
    - yarn lint

license:
  stage: check
  image: denoland/deno:alpine-1.46.3
  needs: []
  cache: []
  script:
    - deno run --allow-read https://deno.land/x/license_checker@v3.2.2/main.ts

check-version:
  stage: check
  extends: .on-tag
  image: $NODE_IMAGE
  needs: []
  cache: []
  script:
    - |
      yarn -s workspaces info | node -e '
        const fs = require("fs");
        const tag = process.env.CI_COMMIT_TAG;
        const workspaces = Object.values(JSON.parse(fs.readFileSync(0, "utf8")));
        const manifests = [".", ...workspaces.map(({location}) => location)]
          .map(location => JSON.parse(fs.readFileSync(`${location}/package.json`, "utf8")));
        const androidVersion = fs.readFileSync("android/app/build.gradle", "utf8")
          .match(/versionName "([^"]+)"/)[1];
        const mismatches = [
          ...manifests.map(({name, version}) => ({name, version})),
          {name: "android versionName", version: androidVersion},
        ].filter(({version}) => version !== tag);
        mismatches.forEach(({name, version}) => console.error(`${name}: ${version} (expected ${tag})`));
        process.exit(mismatches.length > 0 ? 1 : 0);
      '
    - echo "RELEASE_LINE=$(echo "$CI_COMMIT_TAG" | cut -d. -f1,2)" > release.env
  artifacts:
    reports:
      dotenv: release.env

build:
  stage: build
  image: $ANDROID_IMAGE
  needs: [format]
  tags: [heavy]
  timeout: 1h
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"
  cache:
    - key:
        files: [yarn.lock]
      paths: [.yarn-cache]
    - key: gradle-$CI_COMMIT_REF_SLUG
      fallback_keys: [gradle-dev]
      paths: [.gradle/wrapper, .gradle/caches]
  script:
    - yarn install --frozen-lockfile
    - yarn build
    - chmod +x android/gradlew
    - cd android && ./gradlew app:assemblePipelineRelease
    - mv app/build/outputs/apk/pipeline/release/aom-*.apk "$CI_PROJECT_DIR/aom-$CI_COMMIT_REF_SLUG.apk"
  artifacts:
    name: aom-$CI_COMMIT_REF_SLUG
    paths: [aom-$CI_COMMIT_REF_SLUG.apk]
    expire_in: 1 week

test:
  stage: test
  image: $NODE_IMAGE
  needs: [format]
  script:
    - yarn install --frozen-lockfile
    - yarn build
    - yarn test

release:
  stage: release
  extends: .on-tag
  image: $RELEASE_IMAGE
  needs: [check-version, format, license, build, test]
  interruptible: false
  cache: []
  script:
    - apk add --no-cache curl
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file "aom-$CI_COMMIT_REF_SLUG.apk" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aom/$RELEASE_LINE/aom-$RELEASE_LINE.apk"
    - |
      {
        echo "**APK :** [aom-$RELEASE_LINE.apk]($CI_PROJECT_URL/-/releases/$CI_COMMIT_TAG/downloads/aom-$RELEASE_LINE.apk)"
        echo
        awk -v version="$CI_COMMIT_TAG" '
          /^## \[/ { inSection = index($0, "## [" version "]") == 1; next }
          inSection
        ' CHANGELOG.md
      } > release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        - name: aom-$RELEASE_LINE.apk
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/aom/$RELEASE_LINE/aom-$RELEASE_LINE.apk
          direct_asset_path: /aom-$RELEASE_LINE.apk
          link_type: package
