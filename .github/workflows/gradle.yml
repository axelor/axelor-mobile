name: Release

on:
  push:
    tags:
      - '**'

env:
  APK_NAME: aom-${{ github.ref_name }}.apk

jobs:
  build:
    name: Build & APK generation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 1.17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build packages
        run: yarn build
      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew app:assemblePipelineRelease
      - name: Rename APK
        run: mv android/app/build/outputs/apk/pipeline/release/aom-*.apk "$APK_NAME"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

  publish-npm:
    name: Publish packages
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm
        run: npm install --global npm@^12
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build packages
        run: yarn build
      - name: Publish packages
        run: |
          export NPM_CONFIG_TAG="latest-$(echo "$GITHUB_REF_NAME" | cut -d. -f1,2)"
          echo "Publishing with dist-tag: $NPM_CONFIG_TAG"
          yarn release

  create-tag-release:
    name: Release tag
    needs: publish-npm
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG_NAME" \
            "$APK_NAME"
