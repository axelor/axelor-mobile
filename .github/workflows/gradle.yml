name: Javascript CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 1.17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: yarn install
      - name: Check Prettier format
        run: yarn format:check
      - name: Check EsLint issues
        run: yarn lint

  build:
    name: Build & APK generation
    runs-on: ubuntu-22.04
    needs: format
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 1.17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: yarn install
      - name: Provide permission for execution
        run: chmod +x android/gradlew
      - name: Check packages
        run: yarn build
      - name: Check Android build
        run: cd android && ./gradlew app:assemblePipelineRelease
      - name: Rename APK
        run: mv android/app/build/outputs/apk/pipeline/release/aom-*.apk android/app/build/outputs/apk/pipeline/release/${{ github.head_ref || github.ref_name }}.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.head_ref || github.ref_name }}.apk
          path: android/app/build/outputs/apk/pipeline/release/${{ github.head_ref || github.ref_name }}.apk

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: format
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 1.17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Test application
        run: yarn && yarn build && yarn test

  check-license-lines:
    name: Check AGPL license header
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v1.x
      - name: check-license
        run: deno run --allow-read https://deno.land/x/license_checker@v3.2.2/main.ts

  publish-npm:
    needs: [format, build, check-license-lines]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: Publish packages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Upgrade npm
        run: npm install --global npm@^12
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check packages
        run: yarn build
      - name: Publish packages
        run: yarn release

  create-tag-release:
    needs: [publish-npm]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: Release tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download site content
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.head_ref || github.ref_name }}.apk
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ github.head_ref || github.ref_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv "./$ARTIFACT_NAME.apk" "./aom-$TAG_NAME.apk"
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG_NAME" \
            "./aom-$TAG_NAME.apk"
